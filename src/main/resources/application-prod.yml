spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/gestion_plantillas}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:validate}
    show-sql: false
  security:
    user:
      name: ${ACTUATOR_USER}
      password: ${ACTUATOR_PASSWORD}
  boot:
    admin:
      client:
        url: http://gestorrh-admin-prod:9090/admin
        username: ${ADMIN_USER}
        password: ${ADMIN_PASSWORD}
        instance:
          name: GestorRH-API
          service-base-url: http://gestorrh-api-prod:8080
          management-base-url: http://gestorrh-api-prod:8080
          metadata:
            management.username: ${ACTUATOR_USER}
            management.password: ${ACTUATOR_PASSWORD}

logging:
  level:
    root: INFO
    com.gestorrh.api: INFO

jwt:
  secret: ${JWT_SECRET}
  expiration: 86400000