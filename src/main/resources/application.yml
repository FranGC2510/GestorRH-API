spring:
  application:
    name: GestorRH-API
  profiles:
    active: dev

  jpa:
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC

  flyway:
    enabled: true
    locations: classpath:db/migration

  # CONFIGURACIÓN DE SUBIDA DE ARCHIVOS
  servlet:
    multipart:
      max-file-size: 5MB
      max-request-size: 5MB

server:
  port: 8080
  forward-headers-strategy: framework

# RUTA RELATIVA PARA JUSTIFICANTES
file:
  upload-dir: uploads/ausencias

# CONFIGURACIÓN DE SWAGGER / OPENAPI
springdoc:
  swagger-ui:
    tags-sorter: alpha
    operations-sorter: method

# CONFIGURACIÓN DE ACTUATOR
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,env,loggers,threaddump,scheduledtasks
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
  info:
    env:
      enabled: true
    java:
      enabled: true
    os:
      enabled: true

# INFORMACIÓN DE LA APLICACIÓN (endpoint /actuator/info)
info:
  app:
    name: GestorRH-API
    description: API REST del ecosistema GestorRH

# CONFIGURACIÓN DE RATE LIMITING
rate-limit:
  login:
    max-requests: ${RATE_LIMIT_LOGIN_MAX_REQUESTS:10}
    window-minutes: ${RATE_LIMIT_LOGIN_WINDOW_MINUTES:5}
  registro:
    max-requests: ${RATE_LIMIT_REGISTRO_MAX_REQUESTS:5}
    window-minutes: ${RATE_LIMIT_REGISTRO_WINDOW_MINUTES:10}