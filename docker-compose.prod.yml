services:
  postgres:
    image: postgres:16
    container_name: gestorrh-postgres-prod
    environment:
      POSTGRES_DB: gestion_plantillas
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - gestorrh_pgdata_prod:/var/lib/postgresql/data
    networks:
      - gestorrh-net
    deploy:
      resources:
        limits:
          memory: 512m
    restart: unless-stopped

  api:
    image: ghcr.io/gestorrh-multiplataforma/gestorrh-api:latest
    container_name: gestorrh-api-prod
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      - DB_URL=jdbc:postgresql://postgres:5432/gestion_plantillas
      - DB_USERNAME=${DB_USERNAME}
      - DB_PASSWORD=${DB_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - DB_DDL_AUTO=update
      - ACTUATOR_USER=${ACTUATOR_USER}
      - ACTUATOR_PASSWORD=${ACTUATOR_PASSWORD}
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    volumes:
      - api_uploads:/app/uploads
      - api_logs:/app/logs
    networks:
      - gestorrh-net
    deploy:
      resources:
        limits:
          memory: 1024m
    depends_on:
      - postgres
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider",
              "http://localhost:8080/actuator/health" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

  admin:
    image: ghcr.io/gestorrh-multiplataforma/gestorrh-admin:latest
    container_name: gestorrh-admin-prod
    ports:
      - "127.0.0.1:9090:9090"
    environment:
      - ADMIN_USER=${ADMIN_USER}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - ACTUATOR_USER=${ACTUATOR_USER}
      - ACTUATOR_PASSWORD=${ACTUATOR_PASSWORD}
    networks:
      - gestorrh-net
    deploy:
      resources:
        limits:
          memory: 512m
    depends_on:
      - api
    healthcheck:
      test: [ "CMD", "wget", "--quiet", "--tries=1", "--spider",
              "http://localhost:9090/admin/login" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s
    restart: unless-stopped

networks:
  gestorrh-net:
    driver: bridge

volumes:
  gestorrh_pgdata_prod:
  api_uploads:
  api_logs: